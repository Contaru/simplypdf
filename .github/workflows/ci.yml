name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Render samples
        run: |
          mkdir -p samples-output
          dotnet run --no-build --configuration Release --project samples/DianInvoice -- samples-output/FE0177192.pdf
          dotnet run --no-build --configuration Release --project samples/PosReceipt -- samples-output
          dotnet run --no-build --configuration Release --project samples/PosInvoice -- samples-output/factura-pos.pdf

      - name: Verify generated metrics are up to date
        run: |
          dotnet run --no-build --configuration Release --project tools/AfmToCSharp -- tools/afm src/SimplyPdf/Fonts/StandardFontMetrics.Data.g.cs
          git diff --exit-code -- src/SimplyPdf/Fonts/StandardFontMetrics.Data.g.cs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-pdfs
          path: samples-output/*.pdf
          if-no-files-found: ignore
